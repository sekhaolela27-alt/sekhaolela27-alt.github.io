<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lebz Beauty Co — Bookings</title>

<style>
  body {
    background: #ffffff;
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 20px;
    color: #333;
  }

  h1 {
    color: #ff6fa3;
    text-align: center;
    font-weight: 700;
  }

  .booking-box {
    max-width: 500px;
    margin: 20px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border: 1px solid #f1f1f1;
  }

  label {
    font-weight: 600;
    margin-top: 10px;
    display: block;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
  }

  button {
    width: 100%;
    padding: 15px;
    background: #ff6fa3;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .notice {
    background: #ffe3ef;
    padding: 12px;
    border-left: 5px solid #ff6fa3;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14.5px;
  }

  .privacy {
    font-size: 13px;
    color: #666;
    margin-top: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Lebz Beauty Co — Booking</h1>

<div class="booking-box">

  <div class="notice">
    Booking fee is <b>R100</b>.<br>
    Please pay to Capitec <b>1488197286</b> before confirming your booking.<br><br>
    <b>All booking details are sent privately to admin WhatsApp only.</b>
  </div>

  <label>Your Full Name</label>
  <input type="text" id="name" placeholder="Enter your name">

  <label>Your Phone Number</label>
  <input type="tel" id="phone" placeholder="Enter phone number">

  <label>Select Date</label>
  <input type="date" id="date">

  <label>Select Time</label>
  <input type="time" id="time">

  <button onclick="sendBooking()">Confirm Booking</button>

  <div class="privacy">
    Your information is not displayed on the website and is shared only with Lebz Beauty Co admin.
  </div>
</div>

<script>
function sendBooking() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;

  if (!name || !phone || !date || !time) {
    alert("Please fill in all fields.");
    return;
  }

  const adminNumber = "27685072848"; // Admin WhatsApp only

  let message = `NEW BOOKING (PRIVATE)%0A%0A` +
                `Name: ${name}%0A` +
                `Phone: ${phone}%0A` +
                `Date: ${date}%0A` +
                `Time: ${time}%0A%0A` +
                `Booking Fee: R100 (Capitec 1488197286)`;

  let url = `https://wa.me/${adminNumber}?text=${message}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
