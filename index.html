<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BUCLE IT INTERGRATION</title>
  <meta name="description" content="BUCLE — Technology and business solutions for a digital world.">
  <style>
    :root{--accent:#0044ff;--muted:#000000;--bg:#f7fafc}
    *{box-sizing:border-box}
    body{font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:#ffffff}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
    .brand{display:flex;align-items:center;gap:12px}
  nav a {
  margin-left: 18px;
  text-decoration: none;
  color: rgb(0, 204, 255);
  font-weight: 600;
}

    .hero{background:white;border-radius:12px;padding:28px;margin-top:18px;color:#111;border:1px solid #e6e9ee}
    .hero h1{margin:0;font-size:28px;color:var(--accent)}
    .hero p{color:var(--muted);line-height:1.5}
    .cta{margin-top:16px}
    .btn{display:inline-block;padding:10px 16px;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:700}
    .card{background:white;border-radius:12px;padding:18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
    .services li{margin:10px 0}
    footer{margin-top:28px;text-align:center;color:var(--muted);font-size:14px;padding:18px}
    .contact-list{list-style:none;padding:0;margin:0}
    .contact-list li{margin:8px 0}
    .team-collage{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
    .team-collage img{width:100%;border-radius:12px;height:180px;object-fit:cover}
    body {
  font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  margin:0;
  background-image: url('bucle logo.jpg');
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-position: center;
  color:#111;
}

  </style>
</head>
<body>
  <a href="BUCLE WEB.html" />
</body>
</html>
